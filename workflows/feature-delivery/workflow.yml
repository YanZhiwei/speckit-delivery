schema_version: "1.0"
workflow:
  id: "feature-delivery"
  name: "Spec Kit Feature Delivery"
  version: "0.2.2"
  author: "Yan Zhiwei"
  description: "Evidence-first feature delivery with code/history/reference exploration, scope and design approval, slice planning and merge policy, quality, review, and handoff."

requires:
  speckit_version: ">=0.16.4"
  integrations:
    any: ["codex", "claude", "copilot", "gemini", "opencode", "generic"]

inputs:
  delivery_run:
    type: string
    required: true
    prompt: "Unique delivery run id (safe single path segment; reuse on resume)"
  spec:
    type: string
    required: true
    prompt: "Describe the feature or architectural change"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto selects the project's default"
  with_docs_sync:
    type: boolean
    default: true
    prompt: "Run configured documentation synchronization?"

steps:
  - id: delivery-doctor
    command: speckit.delivery.doctor
    integration: "{{ inputs.integration }}"
    input: { args: "lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }}" }

  - id: decision-discover
    command: speckit.decision.context
    integration: "{{ inputs.integration }}"
    input: { args: "mode=discover {{ inputs.spec }}" }

  - id: explore
    command: speckit.delivery.explore
    integration: "{{ inputs.integration }}"
    input: { args: "lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }} Persist .specify/delivery/{{ inputs.delivery_run }}/exploration.md before returning; no context-only workflow handoff." }

  - id: scope-gate
    show_file: ".specify/delivery/{{ inputs.delivery_run }}/exploration.md"
    type: gate
    message: "Review the current and candidate directory trees, code/history/GitHub evidence, alternatives, exclusions, risks, and unknowns in the conversation. Approve only when exploration is ready, the Feature lane is appropriate, and any non-critical evidence limitations are explicitly accepted; record scope approval in the packet or preserved context. Reject/stop on critical gaps or a lane change, carrying evidence to the appropriate lane."
    options: [approve, reject]
    on_reject: abort

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        scope_approval={{ steps.scope-gate.output.choice }}
        Read this exact persisted exploration packet. Record the actual supplied
        scope-gate choice, approved scope/snapshot, and accepted limitations there
        before specifying; missing packet/approval or changed scope/snapshot stops
        progression. Do not infer approval from ready. Consume its
        including source/history/reference evidence, boundaries, and unknowns.
        Keep this canonical run path when the feature location becomes known;
        record that location in the packet. Honor artifact_policy.
        Specify behavior and acceptance, not locked file design;
        stop and renew scope approval for material expansion or a lane change.

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md {{ inputs.spec }} Use the approved exploration and spec; preserve evidence-backed scope and surface material changes for renewed approval." }

  - id: clarify-gate
    type: gate
    message: "Review clarified requirements before architecture planning."
    options: [approve, reject]
    on_reject: abort

  - id: decision-resolve
    command: speckit.decision.context
    integration: "{{ inputs.integration }}"
    input: { args: "mode=resolve delivery_run={{ inputs.delivery_run }} exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md {{ inputs.spec }} Read the approved exploration and clarified spec; surface any scope-changing ADR conflict before planning." }

  - id: code-context
    command: speckit.delivery.context
    integration: "{{ inputs.integration }}"
    continue_on_error: true
    input: { args: "lane=feature {{ inputs.spec }}" }

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        Consume this exact approved exploration packet, clarified spec, and
        resolved decision context. Follow the Plan checkpoint format in the
        installed delivery/templates/exploration.md. Keep exact design in plan.md
        and present the finalized change tree, file responsibilities, interfaces
        and data flow, test paths and commands, compatibility/migration/security
        risks, and differences from approved scope in the conversation.
        Stop for renewed scope approval on material expansion; scope approval
        alone is not design approval. Do not implement.

  - id: decision-propose
    command: speckit.decision.propose
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.spec }}" }

  - id: plan-gate
    type: gate
    message: "Approve the shown finalized directory tree, file responsibilities, interfaces, tests/commands, risks, and Proposed ADR baseline before task generation. Record design approval against this plan; material scope changes require renewed scope approval, not inference from the earlier candidate tree."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md design_approval={{ steps.plan-gate.output.choice }} {{ inputs.spec }} Read the approved exploration, spec, plan, and ADR baseline; record the supplied plan-gate choice against the unchanged shown design, or stop if missing/stale. Derive tasks with exact change/test paths from the approved design, not just the original request. Material expansion returns to scope/design approval." }

  - id: slice
    command: speckit.delivery.slice
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
        design_approval={{ steps.plan-gate.output.choice }}
        {{ inputs.spec }}
        Read the approved plan and generated tasks. Map every task exactly once,
        classify trunk safety with executable evidence, derive the merge mode,
        and write the slice plan. Do not edit tasks.md or implement. Return
        needs_decision instead of forcing a mode when evidence or policy is
        missing.

  - id: slice-gate
    show_file: ".specify/delivery/{{ inputs.delivery_run }}/slices.md"
    type: gate
    message: "Review the slice table, task coverage, trunk-safety evidence, merge mode, diff budgets, flags, verification, rollback, and merge policy. For a single-slice plan, confirm that one PR is appropriate. For stacked, approve only when every task is mapped exactly once, every prefix has credible trunk-safety evidence, and no unknown remains. For integration, confirm the explicit integration-only reason and accepted rollback scope. A material change to scope, design, task mapping, or merge policy requires renewed slice approval."
    options: [approve, reject]
    on_reject: abort

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    continue_on_error: true
    input: { args: "delivery_run={{ inputs.delivery_run }} slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} {{ inputs.spec }} Record the actual slice-gate choice against the unchanged slice plan or stop if missing/stale. Verify every task is mapped to exactly one approved slice, every acceptance requirement is covered, the slice dependency order is acyclic and linear for stacked mode, and every slice has verification and rollback. Treat slices.md as boundary metadata, not a second execution queue; report blocking findings without rewriting tasks.md." }

  - id: analyze-gate
    type: gate
    message: "Confirm blocking Spec/Plan/Tasks findings are resolved before execution."
    options: [approve, reject]
    on_reject: abort

  - id: quality-brief-before-ralph
    command: speckit.quality.brief
    integration: "{{ inputs.integration }}"
    input: { args: "scope=implementation {{ inputs.spec }}" }

  - id: ralph
    command: speckit.ralph.run
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} {{ inputs.spec }} Require the actual slice-gate approval and unchanged slice plan. Execute only tasks from tasks.md, in slice order. Stop at each approved slice boundary, run the declared quality/standards/review and prefix/flag/checkpoint verification, write the slice receipt, and continue only after SLICE_READY. Do not create, push, or merge a PR." }

  - id: quality-after-ralph
    command: speckit.quality.check
    integration: "{{ inputs.integration }}"
    input: { args: "scope=outgoing-diff {{ inputs.spec }}" }

  - id: standards-after-ralph
    command: speckit.review.standards
    integration: "{{ inputs.integration }}"
    input: { args: "scope=outgoing-diff {{ inputs.spec }}" }

  - id: converge-loop
    type: do-while
    condition: "true"
    max_iterations: 3
    steps:
      - id: converge
        command: speckit.converge
        integration: "{{ inputs.integration }}"
        continue_on_error: true
        input: { args: "{{ inputs.spec }}" }
      - id: analyze-appended
        command: speckit.analyze
        integration: "{{ inputs.integration }}"
        continue_on_error: true
        input: { args: "delivery_run={{ inputs.delivery_run }} slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} Analyze tasks appended by convergence for {{ inputs.spec }}. Assign every appended task to an existing approved slice; if a new slice is required, stop for renewed slice approval instead of silently extending the queue." }
      - id: ralph-appended
        command: speckit.ralph.run
        integration: "{{ inputs.integration }}"
        input: { args: "delivery_run={{ inputs.delivery_run }} slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} Complete dependency-ready tasks appended for {{ inputs.spec }} only after they are mapped to an approved slice; preserve slice boundaries." }
      - id: quality-appended
        command: speckit.quality.check
        integration: "{{ inputs.integration }}"
        input: { args: "scope=outgoing-diff {{ inputs.spec }}" }
      - id: standards-appended
        command: speckit.review.standards
        integration: "{{ inputs.integration }}"
        input: { args: "scope=outgoing-diff {{ inputs.spec }}" }

  - id: simplify-scan
    command: speckit.simplify.scan
    integration: "{{ inputs.integration }}"
    input: { args: "scope=diff {{ inputs.spec }}" }

  - id: simplify-gate
    type: gate
    message: "Review simplification candidates and confirm accepted candidates are routed."
    options: [approve, reject]
    on_reject: abort

  - id: simplify-tasks-analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    continue_on_error: true
    input: { args: "delivery_run={{ inputs.delivery_run }} slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} Analyze any tasks appended by simplification for {{ inputs.spec }}. Map each task to an approved slice or stop for renewed slice approval." }

  - id: simplify-tasks-run
    command: speckit.ralph.run
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md slice_approval={{ steps.slice-gate.output.choice }} Complete accepted simplification tasks for {{ inputs.spec }} only within approved slice boundaries." }

  - id: quality-after-simplify
    command: speckit.quality.check
    integration: "{{ inputs.integration }}"
    input: { args: "scope=outgoing-diff {{ inputs.spec }}" }

  - id: standards-after-simplify
    command: speckit.review.standards
    integration: "{{ inputs.integration }}"
    input: { args: "scope=outgoing-diff {{ inputs.spec }}" }

  - id: docs-sync
    type: if
    condition: "{{ inputs.with_docs_sync }}"
    then:
      - id: docs-sync-run
        command: speckit.docs-sync.run
        integration: "{{ inputs.integration }}"
        input: { args: "{{ inputs.spec }}" }

  # Safe no-op slots after a current pass; semantic verdicts are checked at the gate.
  - id: review-loop
    type: do-while
    condition: "true"
    max_iterations: 3
    steps:
      - id: review
        command: speckit.review.run
        integration: "{{ inputs.integration }}"
        input: { args: "delivery_run={{ inputs.delivery_run }} lane=feature scope=outgoing-diff slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md {{ inputs.spec }} Reuse only a complete current snapshot-bound pass; otherwise independently review all six dimensions, account for previous findings, and cover cross-slice integration as well as per-slice changes." }
      - id: review-fix
        command: speckit.delivery.review-fix
        integration: "{{ inputs.integration }}"
        input: { args: "delivery_run={{ inputs.delivery_run }} lane=feature scope=outgoing-diff repair_slots=3 {{ inputs.spec }} One repair pass only; current pass is no-op. Preserve attempts and task queue ownership; stop source edits on cap, stale report, missing evidence, or scope change." }

  - id: review-final
    command: speckit.review.run
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} lane=feature scope=outgoing-diff slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md {{ inputs.spec }} Verify after the last repair slot or reuse a still-current complete pass; do not add another repair round. Present all six verdicts, coverage, cross-slice integration evidence, and unresolved finding IDs." }

  - id: review-gate
    type: gate
    message: "Approve only a complete current snapshot-bound REVIEW_VERDICT: pass across all six dimensions, with actual independence or explicitly accepted self-review degradation, full required coverage, and every prior blocker verified resolved/dismissed. No user gate, repair no-op, test pass, or round limit overrides blocked/incomplete. Otherwise stop with open findings and recovery instructions."
    options: [approve, reject]
    on_reject: abort

  - id: decision-finalize
    command: speckit.decision.finalize
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.spec }}" }

  - id: decision-check
    command: speckit.decision.check
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.spec }}" }

  - id: simplify-verify
    command: speckit.simplify.verify
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.spec }}" }

  - id: review-close
    command: speckit.review.run
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} lane=feature scope=outgoing-diff slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md {{ inputs.spec }} Reuse the final pass only if contents and requirements still match after ADR/finalization checks; otherwise refresh review. Do not reset repair attempts or hide ADR changes. A stale/blocked/incomplete result stops evidence and handoff." }

  - id: evidence
    command: speckit.evidence.collect
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.spec }}" }

  - id: handoff
    command: speckit.delivery.handoff
    integration: "{{ inputs.integration }}"
    input: { args: "delivery_run={{ inputs.delivery_run }} lane=feature slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md mode=auto {{ inputs.spec }} Render the final release-slice or rollup PR body from the approved slice plan. Include the merge plan, but do not push, create, or merge the PR." }
