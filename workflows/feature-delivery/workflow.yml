schema_version: "1.0"
workflow:
  id: "feature-delivery"
  name: "Spec Kit Feature Delivery"
  version: "0.4.3"
  author: "Yan Zhiwei"
  description: "Evidence-first feature delivery with code/history/reference exploration, scope and design approval, slice planning, guarded execution, convergence, quality, review, and handoff."

requires:
  speckit_version: ">=1.2.3"
  integrations:
    any: ["codex", "claude", "copilot", "gemini", "opencode", "generic"]

inputs:
  delivery_run:
    type: string
    required: true
    prompt: "Unique delivery run id (safe single path segment; reuse on resume)"
  spec:
    type: string
    required: true
    prompt: "Describe the feature or architectural change"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto selects the project's default"
  runtime_python:
    type: string
    default: "python"
    prompt: "Verified Python 3.11+ invocation (for example python, python3, or py -3 on Windows)"
  with_docs_sync:
    type: boolean
    default: true
    prompt: "Run configured documentation synchronization?"

steps:
  - id: runtime-init
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} init
      --run {{ inputs.delivery_run }} --lane feature

  - id: delivery-doctor
    command: speckit.delivery.doctor
    integration: "{{ inputs.integration }}"
    input: { args: "lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }}" }

  - id: decision-discover
    command: speckit.decision.context
    integration: "{{ inputs.integration }}"
    input: { args: "mode=discover lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }}" }

  - id: explore
    command: speckit.delivery.explore
    integration: "{{ inputs.integration }}"
    input: { args: "lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }} Persist .specify/delivery/{{ inputs.delivery_run }}/exploration.md before returning. Do not invent a Feature directory before Core Specify creates one. No context-only workflow handoff." }

  - id: runtime-phase-exploration
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} phase
      --run {{ inputs.delivery_run }} --name exploration

  - id: runtime-present-scope
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} present
      --run {{ inputs.delivery_run }} --name scope
      --input .specify/delivery/{{ inputs.delivery_run }}/exploration.md

  - id: scope-gate
    show_file: ".specify/delivery/{{ inputs.delivery_run }}/exploration.md"
    type: gate
    message: "Review the current and candidate directory trees, code/history/GitHub evidence, alternatives, exclusions, risks, and unknowns in the conversation. Approve only when exploration is ready, the Feature lane is appropriate, and any non-critical evidence limitations are explicitly accepted; record scope approval in the packet or preserved context. Reject/stop on critical gaps or a lane change, carrying evidence to the appropriate lane."
    options: [approve, reject]
    on_reject: abort

  - id: runtime-decide-scope
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} decide
      --run {{ inputs.delivery_run }} --name scope
      --choice {{ steps.scope-gate.output.choice }}

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        scope_approval={{ steps.scope-gate.output.choice }}
        Read this exact persisted exploration packet. Record the actual supplied
        scope-gate choice, approved scope/snapshot, and accepted limitations there
        before specifying; missing packet/approval or changed scope/snapshot stops
        progression. Consume its source/history/reference evidence, boundaries,
        and unknowns. Keep this canonical run path when the Feature location
        becomes known and emit exactly one `FEATURE_DIR: <project-relative-directory>`
        line in the packet. Honor artifact_policy. Specify behavior and acceptance,
        not locked file design; stop and renew scope approval for material expansion
        or a lane change.

  - id: runtime-bind-feature
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} bind
      --run {{ inputs.delivery_run }}
      --feature-from-packet .specify/delivery/{{ inputs.delivery_run }}/exploration.md

  - id: clarify-runtime-begin
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
      --run {{ inputs.delivery_run }} --stage clarify

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        runtime_stage=clarify
        runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-clarify.json
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        {{ inputs.spec }} Use the approved exploration and spec; preserve
        evidence-backed scope and surface material changes for renewed approval.
        Read .specify/extensions/delivery/templates/runtime.md and
        .specify/extensions/delivery/templates/core-adapter.md in full. Read the
        pending runtime input and write the native report, machine native receipt, and normalized envelope defined by runtime.md
        only at the supplied runtime result path.

  - id: clarify-runtime-record
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
      --run {{ inputs.delivery_run }} --stage clarify

  - id: clarify-needs
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} needs
      --run {{ inputs.delivery_run }} --kind clarification

  - id: clarification-approval
    type: if
    condition: "{{ steps.clarify-needs.output.stdout == 'true' }}"
    then:
      - id: runtime-present-clarification
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} present
          --run {{ inputs.delivery_run }} --name clarification
          --input .specify/delivery/{{ inputs.delivery_run }}/exploration.md --binding spec
      - id: clarify-gate
        type: gate
        message: "Review clarified requirements before architecture planning. Approve only the current run's presented clarification inputs; reject material scope changes for renewed exploration approval."
        options: [approve, reject]
        on_reject: abort
      - id: runtime-decide-clarification
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} decide
          --run {{ inputs.delivery_run }} --name clarification
          --choice {{ steps.clarify-gate.output.choice }}

  - id: runtime-phase-planning
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} phase
      --run {{ inputs.delivery_run }} --name planning

  - id: decision-resolve
    command: speckit.decision.context
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        mode=resolve lane=feature delivery_run={{ inputs.delivery_run }}
        clarification_choice={{ steps.clarify-gate.output.choice | default('not-required') }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        {{ inputs.spec }} Read the approved exploration and clarified runtime
        result; surface any scope-changing ADR conflict before planning.

  - id: code-context
    command: speckit.delivery.context
    integration: "{{ inputs.integration }}"
    input: { args: "lane=feature delivery_run={{ inputs.delivery_run }} {{ inputs.spec }} Reuse the current Explore map and write only this run's code-context.md when a concrete gap remains." }

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        Consume this exact approved exploration packet, clarified spec, and
        resolved decision context. Follow the Plan checkpoint format in the
        installed delivery/templates/exploration.md, including Architecture
        constraints and optional skill methods, before choosing the design. Keep
        the constraint table and exact design in the actual feature plan.md;
        record its exact path in the canonical exploration packet. Prepare
        constraint sources, design responses, verification owners/mechanisms and
        gaps with the finalized change tree, file responsibilities, interfaces and
        data flow, test paths and commands, compatibility/migration/security risks,
        and differences from approved scope. Stop for renewed scope approval on
        material expansion; scope approval alone is not design approval. Do not implement.

  - id: decision-propose
    command: speckit.decision.propose
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        {{ inputs.spec }} Read this packet's exact plan and establish the Proposed
        ADR baseline. Then, as Delivery coordinator, follow the installed Plan
        checkpoint to record the final presented fingerprint/method/input manifest
        in this packet and present the design, ADR baseline, and Architecture
        constraints for the existing plan gate. Never infer approval; changes after
        this presentation require a new checkpoint.

  - id: design-present
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} present
      --run {{ inputs.delivery_run }} --name design --binding spec --binding plan
      --input .specify/delivery/{{ inputs.delivery_run }}/exploration.md

  - id: plan-gate
    type: gate
    message: "Approve the shown finalized directory tree, file responsibilities, interfaces, tests/commands, risks, Proposed ADR baseline, and Architecture constraints table before task generation. Each binding constraint needs a design response, verification owner and credible mechanism; planned checks and semantic-only or unsupported coverage remain explicit. Decision-critical gaps block approval. Record design approval against this plan; material scope changes require renewed scope approval."
    options: [approve, reject]
    on_reject: abort

  - id: design-decide
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} decide
      --run {{ inputs.delivery_run }} --name design --choice {{ steps.plan-gate.output.choice }}

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        design_approval={{ steps.plan-gate.output.choice }} {{ inputs.spec }}
        Read .specify/extensions/delivery/templates/core-adapter.md in full before
        generating Tasks; it defines one independently verifiable green vertical
        Task rather than separate TDD-step items. Read the approved exploration,
        spec, exact plan path recorded in that packet, and ADR baseline. Recompute the presented plan/requirements/policy
        identity using the stored method and input manifest; only after a match
        record the supplied plan-gate choice. Derive independently verifiable
        vertical green tasks with exact change/test paths, applicable constraint IDs,
        and planned verification work. Keep semantic checks assigned to their named
        reviewer; do not invent executable coverage. Material expansion returns to
        scope/design approval.

  - id: slice
    command: speckit.delivery.slice
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
        design_approval={{ steps.plan-gate.output.choice }} {{ inputs.spec }}
        Read the approved plan and generated tasks. Map every task exactly once,
        classify trunk safety with executable evidence, derive the merge mode, and
        write the slice plan. Do not edit tasks.md or implement. Return
        needs_decision instead of forcing a mode when evidence or policy is missing.

  - id: analyze-runtime-begin
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
      --run {{ inputs.delivery_run }} --stage analyze

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        runtime_stage=analyze
        runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-analyze.json
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md {{ inputs.spec }}
        Read .specify/extensions/delivery/templates/runtime.md and
        .specify/extensions/delivery/templates/core-adapter.md in full. Analyze
        the planned slices against the exact approved plan before the
        combined execution/slice gate. Verify every task is mapped to exactly one
        planned slice, every acceptance requirement and binding Architecture
        constraint has task/verification coverage, the dependency order is acyclic,
        and every slice has verification and rollback. Report missing constraint
        IDs, verification work, or review owners as blocking findings; planned or
        unsupported checks are not execution evidence. Read the pending runtime
        input and write the native report, machine native receipt, and normalized envelope defined by runtime.md at the supplied path.

  - id: analyze-runtime-record
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
      --run {{ inputs.delivery_run }} --stage analyze

  - id: analyze-require
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} require
      --run {{ inputs.delivery_run }} --kind analyze

  - id: execution-present
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} present
      --run {{ inputs.delivery_run }} --name execution --binding spec --binding plan --binding tasks
      --input .specify/delivery/{{ inputs.delivery_run }}/slices.md

  - id: slice-gate
    show_file: ".specify/delivery/{{ inputs.delivery_run }}/slices.md"
    type: gate
    message: "Confirm every blocking Spec/Plan/Tasks/analyze finding is resolved and execution is ready. Review the slice table, task coverage, trunk-safety evidence, merge mode, diff budgets, flags, verification, rollback, and merge policy. A failed or incomplete Analyze result, context-only choice, or unknown slice is not approval. This is the single combined execution/slice gate; record its actual choice through the Delivery-owned writer."
    options: [approve, reject]
    on_reject: abort

  - id: execution-decide
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} decide
      --run {{ inputs.delivery_run }} --name execution --choice {{ steps.slice-gate.output.choice }}

  - id: slice-approval
    command: speckit.delivery.slice
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        action=record-approval lane=feature delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
        design_approval={{ steps.plan-gate.output.choice }}
        slice_approval={{ steps.slice-gate.output.choice }} {{ inputs.spec }}
        Record the actual combined gate choice and current approved snapshot in
        displayed slices.md; stop on a missing fingerprint, changed plan, failed
        Analyze result, or missing choice. Do not replan or edit tasks/source.

  - id: planning-checkpoint-begin
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
      --run {{ inputs.delivery_run }} --stage checkpoint

  - id: planning-checkpoint
    command: speckit.delivery.route
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        action=checkpoint stage=initial lane=feature delivery_run={{ inputs.delivery_run }}
        runtime_stage=checkpoint runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-checkpoint.json
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
        slice_approval={{ steps.slice-gate.output.choice }} {{ inputs.spec }}
        Read .specify/extensions/delivery/templates/runtime.md and core-adapter.md.
        Perform only an already project-authorized exact planning-path commit,
        preserve original approvals, and write the native SD_CORE_HANDOFF plus
        normalized checkpoint result. Missing authorization or unrelated dirty work blocks.

  - id: planning-checkpoint-record
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
      --run {{ inputs.delivery_run }} --stage checkpoint

  - id: runtime-require-planning
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} require
      --run {{ inputs.delivery_run }} --kind planning

  - id: runtime-phase-execution
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} phase
      --run {{ inputs.delivery_run }} --name execution

  - id: ralph
    command: speckit.ralph.run
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
        slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
        slice_approval={{ steps.slice-gate.output.choice }}
        with_docs_sync={{ inputs.with_docs_sync | to_json }} {{ inputs.spec }}
        Require the actual combined slice/execution approval and unchanged slice
        plan. Execute only tasks from tasks.md, in slice order. Stop at each
        approved slice boundary, run declared quality/standards/review and prefix/
        flag/checkpoint verification, write the slice receipt, and continue only
        after SLICE_READY. Do not create, push, or merge a PR.

  - id: task-closure-after-ralph
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} require
      --run {{ inputs.delivery_run }} --kind task-closure

  - id: quality-after-ralph-needed
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} needs
      --run {{ inputs.delivery_run }} --kind quality

  - id: quality-after-ralph-if-needed
    type: if
    condition: "{{ steps.quality-after-ralph-needed.output.stdout == 'true' }}"
    then:
      - id: quality-after-ralph-runtime-begin
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
          --run {{ inputs.delivery_run }} --stage quality

      - id: quality-after-ralph
        command: speckit.quality.check
        integration: "{{ inputs.integration }}"
        input:
          args: >-
            lane=feature delivery_run={{ inputs.delivery_run }} scope=outgoing-diff
            runtime_stage=quality runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-quality.json
            {{ inputs.spec }} Read the pending runtime input, preserve original check receipts in the native report/data, and write the machine native receipt plus normalized envelope.

      - id: quality-after-ralph-runtime-record
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
          --run {{ inputs.delivery_run }} --stage quality

  - id: standards-after-ralph-needed
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} needs
      --run {{ inputs.delivery_run }} --kind standards

  - id: standards-after-ralph-if-needed
    type: if
    condition: "{{ steps.standards-after-ralph-needed.output.stdout == 'true' }}"
    then:
      - id: standards-after-ralph-runtime-begin
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
          --run {{ inputs.delivery_run }} --stage standards

      - id: standards-after-ralph
        command: speckit.review.standards
        integration: "{{ inputs.integration }}"
        input:
          args: >-
            lane=feature delivery_run={{ inputs.delivery_run }}
            exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
            scope=outgoing-diff runtime_stage=standards
            runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-standards.json
            {{ inputs.spec }} Resolve and validate this packet's approved plan identity before reviewing applicable Architecture constraints. Read the pending runtime input and write the native report, machine native receipt, and normalized envelope defined by runtime.md.

      - id: standards-after-ralph-runtime-record
        type: shell
        run: >-
          {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
          --run {{ inputs.delivery_run }} --stage standards

  - id: converge-runtime-begin
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
      --run {{ inputs.delivery_run }} --stage converge

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        lane=feature delivery_run={{ inputs.delivery_run }}
        runtime_stage=converge runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-converge.json
        exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md {{ inputs.spec }}
        Read .specify/extensions/delivery/templates/core-adapter.md and
        .specify/extensions/delivery/templates/runtime.md in full, plus the pending input. Assess
        the current code against Spec/Plan/Tasks append-only; do not rewrite or
        execute the queue. Write a native report, machine native receipt, and normalized envelope defined by runtime.md at the
        supplied path. If no gap exists, leave tasks.md byte-identical.

  - id: converge-runtime-record
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
      --run {{ inputs.delivery_run }} --stage converge

  - id: convergence-needs
    type: shell
    run: >-
      {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} needs
      --run {{ inputs.delivery_run }} --kind convergence

  - id: convergence-if-needed
    type: if
    condition: "{{ steps.convergence-needs.output.stdout == 'true' }}"
    then:
      - id: convergence-loop
        type: do-while
        condition: "{{ steps.convergence-next.output.stdout == 'true' }}"
        max_iterations: 3
        steps:
          - id: convergence-reserve
            type: shell
            run: >-
              {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} reserve
              --run {{ inputs.delivery_run }} --kind convergence
              --scope outgoing-diff --plain

          - id: convergence-slice
            command: speckit.delivery.slice
            integration: "{{ inputs.integration }}"
            input:
              args: >-
                lane=feature delivery_run={{ inputs.delivery_run }}
                exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
                slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md
                design_approval={{ steps.plan-gate.output.choice }} {{ inputs.spec }}
                Plan a renewed slice mapping for every actual appended TaskID.
                Preserve prior receipt history and boundaries; mark the changed
                mapping pending until the new combined gate. Do not edit tasks.md.

          - id: convergence-analyze-runtime-begin
            type: shell
            run: >-
              {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} begin
              --run {{ inputs.delivery_run }} --stage analyze

          - id: convergence-analyze
            command: speckit.analyze
            integration: "{{ inputs.integration }}"
            input:
              args: >-
                lane=feature delivery_run={{ inputs.delivery_run }} runtime_stage=analyze
                runtime_result=.specify/delivery/{{ inputs.delivery_run }}/runtime/result-analyze.json
                exploration=.specify/delivery/{{ inputs.delivery_run }}/exploration.md
                slices=.specify/delivery/{{ inputs.delivery_run }}/slices.md {{ inputs.spec }}
                Read .specify/extensions/delivery/templates/runtime.md and
                .specify/extensions/delivery/templates/core-adapter.md in full.
                Analyze the appended queue against the Slice owner's newly
                presented mapping. Validate coverage read-only; never assign or
                edit a slice yourself. Write the native report, machine native receipt, and normalized envelope defined by runtime.md.

          - id: convergence-analyze-runtime-record
            type: shell
            run: >-
              {{ inputs.runtime_python }} .specify/extensions/delivery/scripts/delivery_runtime.py --workflow-run {{ context.run_id }} record
              --run {{ inputs.delivery_run }} --stage analyze

          - id: convergence-analyze-require
            type: shell
            run: >-
