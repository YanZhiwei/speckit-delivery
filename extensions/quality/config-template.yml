schema_version: "1.0"

# Keep repository-specific commands and paths here; the distributed extension
# deliberately does not assume a package manager, language, or directory layout.
policy_sources:
  architecture: []
  style: []

# Add one profile per changed-code family. `match` uses repository-relative
# globs. Commands are run from the repository root and must be executable as
# written. Omit a command only when that check is genuinely not applicable.
