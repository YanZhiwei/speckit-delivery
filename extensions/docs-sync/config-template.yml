enabled: false
source_roots: [docs]
generated_roots: []
manifest: null
sync_command: null
verify_command: null
source_is_authoritative: true
# Package README contract: auto | required | off.
# auto: create or refresh a README when a package is new or its public surface
# changes, and report gaps without blocking.
# required: block when a changed package has no README or an unresolved fact gap.
# off: do not run speckit.docs-sync.package-readme.
package_readme: auto
# Optional package roots; empty means detect package manifests from the diff.
package_roots: []
# Project README contract: auto | required | off.
# auto: report structure blockers without blocking.
# required: block a delivery when the structure guard reports README_STRUCTURE: blocked.
# off: do not check project entry READMEs.
project_readme: auto
# Project entry READMEs that stay an index of links.
readme_paths: [README.md]
# Optional line budget; when exceeded, detail moves to readme_docs_root first.
readme_max_lines: null
# Optional ordered level-2 section list; empty means no fixed section contract.
readme_sections: []
# Directory that owns extracted detail; new pages are registered in the README.
readme_docs_root: docs
