schema_version: "1.0"
artifact_policy: tracked
issue_tracker: github
context_files: [AGENTS.md, CONTEXT.md]
adr_directories: [docs/architecture/decisions]
max_convergence_rounds: 3
max_review_fix_rounds: 3
docs_sync: auto
# Delivery slicing: off | auto | stacked | integration. `auto` derives the mode
# from trunk-safety evidence; `off` uses one PR. `stacked` and `integration` pin
# the mode and still require the slice gate.
pr_slicing: auto
# Review-size heuristics, not hard proof. Generated, lock, and vendor files are
# excluded. Exceeding a budget requires an explicit accepted reason.
slice_warn_files: 20
slice_warn_lines: 400
slice_requires_approval: true
# github-native | ghstack | graphite | manual. `manual` is the fallback when the
# host does not support stacked PRs; it still uses ordered branches and rebases.
stack_provider: github-native
merge_policy:
  slice: squash          # squash | rebase | merge
  final: merge-commit    # integration -> target; never squash
  sync: merge            # target -> integration; never rebase a shared branch
  use_queue: true
  delete_branch: true
  freeze_before_final: true
# Use the project's local code graph when `.codegraph/` exists. `off` skips the
# context step; it never blocks delivery.
code_context: auto
# Optional project-relative or absolute path. Leave null to use the
# repository's .github PR template, then this extension's
# templates/pull-request.md, then the section contract in
# speckit.delivery.handoff.
pull_request_template: null
# When true, Delivery Init may copy the packaged fallback template to
# .github/pull_request_template.md, but only when the project has no existing
# template and the user explicitly approves. This static template affects the
# GitHub UI; dynamic per-change bodies still come from
# speckit.delivery.handoff.
install_pull_request_template: false
