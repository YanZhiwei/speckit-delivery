schema_version: "1.0"

extension:
  id: ralph
  name: Ralph Task Orchestrator
  version: "0.4.5"
  description: "Execute Spec Kit tasks with focused implementer context, bounded sequential iterations, verification, and per-task Git commits."
  category: process
  effect: read-write
  author: Yan Zhiwei
  repository: https://github.com/YanZhiwei/speckit-delivery
  homepage: https://github.com/YanZhiwei/speckit-delivery/tree/main/extensions/ralph
  license: MIT

requires:
  speckit_version: ">=0.16.4"

provides:
  commands:
    - name: speckit.ralph.run
      file: commands/speckit.ralph.run.md
      description: "Run one dependency-ready task per iteration, verify it, mark it [X], commit it, and verify the result."
  config:
    - name: ralph-config.yml
      template: config-template.yml
      description: "Ralph provider, sequential execution, branch, commit, retry, and artifact settings."
      required: false

tags: ["agents", "orchestration", "tasks", "implementation", "git"]
