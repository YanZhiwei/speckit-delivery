schema_version: "1.0"

extension:
  id: diagram
  name: Delivery Diagrams
  version: "0.1.3"
  description: "Turn a reviewed change into an evidence-backed diagram, Mermaid by default and a rendered asset only through an installed renderer."
  category: process
  effect: read-write
  author: Yan Zhiwei
  repository: https://github.com/YanZhiwei/speckit-delivery
  homepage: https://github.com/YanZhiwei/speckit-delivery/tree/main/extensions/diagram
  license: MIT

requires:
  speckit_version: ">=0.16.4"

provides:
  commands:
    - name: speckit.diagram.render
      file: commands/speckit.diagram.render.md
      description: "Choose one view, emit Mermaid by default, and render an asset only through an installed renderer."
  config:
    - name: diagram-config.yml
      template: config-template.yml
      description: "Diagram format, renderer selection, output directory, and size limits."
      required: false

tags: ["diagram", "architecture", "visualization", "handoff"]
