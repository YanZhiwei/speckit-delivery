schema_version: "1.0"

extension:
  id: review
  name: Delivery Code Review
  version: "0.2.0"
  description: "Read-only task and final review of requirements, code quality, architecture, correctness, security/compatibility, and tests."
  category: code
  effect: read-only
  author: Yan Zhiwei
  repository: https://github.com/YanZhiwei/speckit-delivery
  homepage: https://github.com/YanZhiwei/speckit-delivery/tree/main/extensions/review
  license: MIT

requires:
  speckit_version: ">=0.16.4"

provides:
  commands:
    - name: speckit.review.standards
      file: commands/speckit.review.standards.md
      description: "Review a task or batch diff against project standards and return a closure verdict."
    - name: speckit.review.run
      file: commands/speckit.review.run.md
      description: "Return six-dimensional, snapshot-bound task or final findings with explicit independence and coverage."

tags: ["review", "quality", "spec", "standards"]
