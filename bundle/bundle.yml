schema_version: "1.0"

bundle:
  id: "speckit-delivery"
  name: "Spec Kit Delivery"
  version: "0.4.0"
  role: "developer"
  description: "Evidence-driven SDD with optional method adapters, decision memory, slice planning and merge policy, quality gates, Ralph orchestration, convergence, simplification, review, documentation sync, and PR handoff."
  author: "Yan Zhiwei"
  license: "MIT"

requires:
  # Bundle installation and guarded workflow control flow are validated against
  # Spec Kit 1.2.3. Individual extension commands retain their own minimum CLI.
  speckit_version: ">=1.2.3"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "bug"
      version: "1.0.1"
    - id: "delivery"
      version: "0.4.0"
    - id: "decision"
      version: "0.4.0"
    - id: "ralph"
      version: "0.4.0"
    - id: "review"
      version: "0.4.0"
    - id: "simplify"
      version: "0.4.0"
    - id: "evidence"
      version: "0.4.0"
    - id: "quality"
      version: "0.4.0"
    - id: "docs-sync"
      version: "0.4.0"
    - id: "diagram"
      version: "0.4.0"
  workflows:
    - id: "feature-delivery"
      version: "0.4.0"
    - id: "bugfix-delivery"
      version: "0.4.0"
    - id: "lightweight-delivery"
      version: "0.4.0"

tags: ["sdd", "delivery", "adr", "quality", "multi-agent", "review"]
