schema_version: "1.0"

bundle:
  id: "speckit-delivery"
  name: "Spec Kit Delivery"
  version: "0.4.8"
  role: "developer"
  description: "Evidence-driven SDD with optional method adapters, decision memory, slice planning and merge policy, quality gates, Ralph orchestration, convergence, simplification, review, documentation sync, and PR handoff."
  author: "Yan Zhiwei"
  license: "MIT"

requires:
  # Bundle minimum: Spec Kit >=1.2.3. Release validation pins 1.2.3 as its
  # deterministic fixture. Individual extension commands retain their own floor.
  speckit_version: ">=1.2.3"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "bug"
      version: "1.0.1"
    - id: "delivery"
      version: "0.4.8"
    - id: "decision"
      version: "0.4.8"
    - id: "ralph"
      version: "0.4.8"
    - id: "review"
      version: "0.4.8"
    - id: "simplify"
      version: "0.4.8"
    - id: "evidence"
      version: "0.4.8"
    - id: "quality"
      version: "0.4.8"
    - id: "docs-sync"
      version: "0.4.8"
    - id: "diagram"
      version: "0.4.8"
  workflows:
    - id: "feature-delivery"
      version: "0.4.8"
    - id: "bugfix-delivery"
      version: "0.4.8"
    - id: "lightweight-delivery"
      version: "0.4.8"

tags: ["sdd", "delivery", "adr", "quality", "multi-agent", "review"]
