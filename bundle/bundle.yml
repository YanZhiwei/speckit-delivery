schema_version: "1.0"

bundle:
  id: "speckit-delivery"
  name: "Spec Kit Delivery"
  version: "0.1.4"
  role: "developer"
  description: "Evidence-driven SDD with decision memory, quality gates, Ralph orchestration, convergence, simplification, review, documentation sync, and PR handoff."
  author: "Yan Zhiwei"
  license: "MIT"

requires:
  # The Bundle installer path is validated against Spec Kit 1.2.3. Individual
  # extensions and workflows remain installable on older supported CLIs.
  speckit_version: ">=1.2.3"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "bug"
      version: "1.0.1"
    - id: "delivery"
      version: "0.1.4"
    - id: "decision"
      version: "0.1.4"
    - id: "ralph"
      version: "0.1.4"
    - id: "review"
      version: "0.1.4"
    - id: "simplify"
      version: "0.1.4"
    - id: "evidence"
      version: "0.1.4"
    - id: "quality"
      version: "0.1.4"
    - id: "docs-sync"
      version: "0.1.4"
    - id: "diagram"
      version: "0.1.4"
  workflows:
    - id: "feature-delivery"
      version: "0.1.4"
    - id: "bugfix-delivery"
      version: "0.1.4"
    - id: "lightweight-delivery"
      version: "0.1.4"

tags: ["sdd", "delivery", "adr", "quality", "multi-agent", "review"]
