name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.1.1"
        required: true
        type: string
      base_ref:
        description: "Branch to prepare from"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release branch and PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0

      - name: Validate version and reserve branch
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semantic X.Y.Z"
            exit 1
          fi
          tag="v$version"
          branch="release/v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; choose a new version."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "::error::Branch $branch already exists; close/delete it or choose a new version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Install Spec Kit
        run: uv tool install specify-cli==1.2.3

      - name: Stamp release metadata
        run: uv run --with pyyaml python scripts/stamp_release.py --version "$VERSION"

      - name: Validate prepared distribution
        run: |
          set -euo pipefail
          uv run --with pyyaml python scripts/test_stamp_release.py
          uv run --with pyyaml python scripts/validate_distribution.py --version "$VERSION"
          uv run --with pyyaml python scripts/test_validate_distribution.py
          python scripts/test_bundle_install.py --version "$VERSION"
          python scripts/package_components.py --version "$VERSION" --output dist
          git diff --check

      - name: Show release diff
        run: git diff --stat

      - name: Commit release preparation
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git add -- bundle catalogs extensions workflows CHANGELOG.md CHANGELOG.zh-CN.md
          git diff --cached --check
          git commit -m "chore(release): prepare $TAG"
          git push origin "$BRANCH"

      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "chore(release): prepare $TAG" \
            --body "$(cat <<EOF
          ## Release preparation for $TAG

          This PR was generated by the **Prepare release PR** workflow.

          It stamps:
          - Bundle, extension, and workflow versions
          - Extension/workflow/bundle catalog versions and tag URLs
          - Release asset download URLs

          Validation performed:
          - \`stamp_release.py\`
          - \`validate_distribution.py --version $VERSION\`
          - Distribution contract tests
          - Local-catalog Bundle installation on Spec Kit 1.2.3
          - Component packaging

          **Do not publish from this branch.** After review and merge, run
          **Release distribution** with version \`$VERSION\` against \`main\`.
          EOF
          )"

      - name: Report PR
        run: |
          echo "Release preparation branch: $BRANCH"
